spring.application.name=travelease-backend

# Import root .env file if present
spring.config.import=optional:file:./.env[.properties]

server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yVHJhdmVsRWFzZUFwcGxpY2F0aW9uMjAyNg==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Razorpay Configuration (Test Mode)
# Values are loaded from environment variables:
#   RAZORPAY_KEY_ID
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Tu5MBBZVX7Eive}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:gR1iUMao49gvdmjl18aVrxUx}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
